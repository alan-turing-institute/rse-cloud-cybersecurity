[project]
name = "subdir-test"
version = "0.1.0"
description = "Pulumi program that deploys Azure infrastructure for storage account subdirectory testing."
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "pulumi>=3.259.0",
    "pulumi-azure-native>=3.26.0",
    "pulumi-random>=4.21.1",
    "azure-core==1.41.0",
    "azure-storage-file-share==12.27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty>=0.0.73",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.11"
